<title>퍼펙트 스택</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 480px 폭의 세로형 스테이지. 위에 HUD, 아래에서 올라오는 시트(시작/결과), 랭킹은 전체 패널.
   블록 색이 높이에 따라 무지개처럼 변하고, 배경 색조가 맨 위 블록을 따라간다. */
:root{
  --ground:#100e26;
  --surface:#1b1840;
  --surface-2:#262257;
  --line:#3b3680;
  --text:#f4f1ff;
  --muted:#a8a3d8;
  --gold:#ffcf5c;
  --gold-deep:#b98a1f;
  --hot:#ff5f8d;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:500 15px/1.5 var(--body);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#15122e}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
  padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-l{justify-self:start;font-size:12px;color:var(--muted);letter-spacing:.06em;min-width:0}
.hud-l b{display:block;font:400 24px/1.1 var(--display);color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.hud-mid{text-align:center}
#score{font:400 76px/1 var(--display);text-shadow:0 4px 0 rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#combo{height:24px;margin-top:6px;font:400 21px/24px var(--display);color:var(--gold);opacity:0;transition:opacity .15s}
#combo.on{opacity:1}
.hud-r{justify-self:end;display:flex;gap:8px;pointer-events:auto}
#stage:not([data-state="play"]):not([data-state="dying"]) .hud-mid{visibility:hidden}
.icon-btn{width:42px;height:42px;padding:0;border-radius:12px;border:1px solid var(--line);background:rgba(27,24,64,.82);
  color:var(--text);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .slash{display:none}
.icon-btn.muted .slash{display:block}
.icon-btn.muted .waves{display:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:12px;
  padding-block:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(27,24,64,.97),#1b1840);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  animation:rise .35s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

.title{margin:0;font:400 42px/1.05 var(--display);text-wrap:balance}
.title span{color:var(--gold)}
.lede{margin:0;color:var(--muted);max-width:34em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.field input{font:500 17px/1.2 var(--body);color:var(--text);background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;width:100%;user-select:text;-webkit-user-select:text}
.hint{margin:0;font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.hint b{color:var(--gold);font-weight:700}

.btn{font:400 21px/1 var(--display);border:0;border-radius:14px;padding:17px 18px;cursor:pointer;color:#241a00;background:var(--gold);
  box-shadow:0 5px 0 var(--gold-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);box-shadow:0 5px 0 #14113a}
.btn.ghost:active{box-shadow:0 1px 0 #14113a}
.btn.small{font-size:16px;padding:10px 14px;box-shadow:0 3px 0 #14113a}
.link{align-self:center;background:none;border:0;color:var(--muted);font:500 13px var(--body);text-decoration:underline;cursor:pointer;padding:4px 8px}

.over-top{display:flex;flex-direction:column;align-items:center;gap:6px}
.over-label{font-size:12px;color:var(--muted);letter-spacing:.12em}
.badge{background:var(--hot);color:#fff;font:400 14px/1 var(--display);padding:6px 11px;border-radius:999px;letter-spacing:.08em}
.over-score{font:400 88px/.9 var(--display);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface-2);border-radius:12px;padding:9px 6px;text-align:center;font-size:12px;color:var(--muted)}
.stats b{display:block;font:400 22px/1.15 var(--display);color:var(--text)}
.rank-line{text-align:center;font-size:15px}
.rank-line b{font:400 30px/1 var(--display);color:var(--gold);margin:0 2px}
.note{margin:0;font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}

#board{position:absolute;inset:0;background:var(--ground);display:flex;flex-direction:column;gap:10px;padding-top:14px;animation:rise .3s cubic-bezier(.2,.9,.3,1)}
#board header{display:flex;justify-content:space-between;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#board h2{margin:0;font:400 32px/1 var(--display)}
#board-status{margin:0;font-size:13px;color:var(--muted);min-height:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#rows{list-style:none;margin:0;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
  padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.r{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--surface)}
.r.me{background:var(--surface-2);outline:2px solid var(--gold)}
.r .no{font:400 22px/1 var(--display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.r.top1 .no{color:#ffcf5c}
.r.top2 .no{color:#d9def7}
.r.top3 .no{color:#f0a06a}
.r .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .sc{font:400 22px/1 var(--display);font-variant-numeric:tabular-nums}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.pop,.sheet,#board{animation:none}}
</style>

<main id="stage" data-state="menu">
  <canvas id="c" aria-label="게임 화면"></canvas>

  <div id="hud">
    <div class="hud-l">내 최고<b id="best">0</b></div>
    <div class="hud-mid"><div id="score">0</div><div id="combo"></div></div>
    <div class="hud-r">
      <button class="icon-btn" id="btn-sound" type="button" aria-label="소리 켜기 또는 끄기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><g class="waves"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></g><path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button class="icon-btn" id="btn-board" type="button" aria-label="랭킹 보기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-6h4.5v6M9.75 20V5h4.5v15M15.5 20v-9H20v9M3 20h18"/></svg>
      </button>
    </div>
  </div>

  <section id="menu" class="sheet">
    <h1 class="title"><span>퍼펙트</span> 스택</h1>
    <p class="lede">탭하면 움직이는 블록이 멈춰요. 아래 블록에 딱 맞추면 퍼펙트, 연속으로 맞추면 점수가 크게 올라가요.</p>
    <div class="field">
      <label for="nick">랭킹에 표시할 닉네임</label>
      <input id="nick" type="text" maxlength="10" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="start" type="button">시작하기</button>
    <p class="hint" id="menu-info"></p>
  </section>

  <section id="over" class="sheet" hidden>
    <div class="over-top">
      <span class="badge" id="badge" hidden>신기록</span>
      <span class="over-label">점수</span>
      <div class="over-score" id="final">0</div>
    </div>
    <div class="stats">
      <div><b id="st-blocks">0</b>쌓은 블록</div>
      <div><b id="st-perf">0</b>퍼펙트</div>
      <div><b id="st-combo">0</b>최대 콤보</div>
    </div>
    <div class="rank-line" id="rank-line"></div>
    <p class="note" id="over-note"></p>
    <div class="row2">
      <button class="btn" id="again" type="button">다시 도전</button>
      <button class="btn ghost" id="to-board" type="button">랭킹</button>
    </div>
    <button class="link" id="to-menu" type="button">닉네임 바꾸기</button>
  </section>

  <section id="board" hidden>
    <header>
      <h2>랭킹</h2>
      <button class="btn ghost small" id="board-close" type="button">닫기</button>
    </header>
    <p id="board-status">랭킹을 불러오는 중이에요.</p>
    <ol id="rows"></ol>
  </section>
</main>

<script>
(function(){
'use strict';

/* ---------- 상수 ---------- */
var W=360, BH=26, BASE_W=190, TOL=6;
var reduceMotion=false;
try{ reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

function $(id){ return document.getElementById(id); }
var stage=$('stage'), canvas=$('c'), ctx=canvas.getContext('2d');
var scale=1, H=640;

var store={
  get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

function resize(){
  var r=canvas.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.width=Math.max(1,Math.round(r.width*dpr));
  canvas.height=Math.max(1,Math.round(r.height*dpr));
  scale=canvas.width/W; H=canvas.height/scale;
}
window.addEventListener('resize',resize);
resize();
try{ document.fonts.load('28px "Black Han Sans"'); }catch(e){}

/* ---------- 소리 ---------- */
var actx=null, master=null, muted=store.get('ps_mute','0')==='1';
function ensureAudio(){
  if(!actx){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC){ actx=new AC(); master=actx.createGain(); master.gain.value=0.5; master.connect(actx.destination); }
    }catch(e){ actx=null; }
  }
  if(actx&&actx.state==='suspended'){ actx.resume().catch(function(){}); }
}
function tone(f,dur,type,vol,slideTo){
  if(!actx||muted) return;
  var t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+0.05);
}
var PENT=[0,2,4,7,9];
function noteFreq(c){
  var i=Math.max(0,c-1), oct=Math.min(2,Math.floor(i/5));
  return 329.63*Math.pow(2,(PENT[i%5]+12*oct)/12);
}
function sfxPerfect(c){
  var f=noteFreq(c);
  tone(150,.12,'sine',.28,70);
  tone(f,.42,'triangle',.34);
  tone(f*2,.3,'sine',.12);
  if(c>=4) tone(f*1.5,.36,'sine',.1);
}
function sfxCut(){ tone(150,.14,'sine',.3,60); tone(95,.18,'square',.07,45); }
function sfxOver(){ tone(280,.6,'sawtooth',.14,55); tone(140,.7,'sine',.25,40); }
function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ---------- 게임 상태 ---------- */
var state='menu';            // menu | play | dying | over
var paused=false;
var layers=[], cur=null;
var score=0, combo=0, maxCombo=0, perfects=0;
var cam=0, camT=0, shake=0, bgHue=330, t=0, overAt=0, restartAt=0;
var parts=[], debris=[], rings=[], texts=[];
var localBest=parseInt(store.get('ps_best','0'),10)||0;
var pendingScore=0;
var stars=[]; for(var si=0;si<46;si++){ stars.push({x:Math.random()*W,y:Math.random(),r:Math.random()*1.4+.4,p:Math.random()*.25+.05}); }

function hueFor(i){ return (330+i*8)%360; }
function spawn(){
  var n=layers.length, top=layers[n-1], w=top.w, fromLeft=(n%2===0);
  cur={x:fromLeft?-w*0.55:W-w*0.45, w:w, dir:fromLeft?1:-1, hue:hueFor(n), n:n};
}
function baseCam(){ return (state==='menu'||state==='over'?H*0.3:H*0.6)+(layers.length-1)*BH; }
function reset(snap){
  layers=[{x:(W-BASE_W)/2,w:BASE_W,hue:hueFor(0),flash:0}];
  score=0; combo=0; maxCombo=0; perfects=0;
  parts.length=0; debris.length=0; rings.length=0; texts.length=0;
  spawn();
  camT=baseCam(); if(snap) cam=camT;
  setScoreUI(0); updateCombo();
}

function setScoreUI(v){
  var el=$('score'); el.textContent=String(v);
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function updateCombo(){
  var el=$('combo');
  if(combo>=2){ el.textContent='콤보 ×'+combo; el.classList.add('on'); } else { el.classList.remove('on'); }
}
function setState(s){ state=s; stage.dataset.state=s; }

/* ---------- 입력 처리 ---------- */
function drop(){
  if(state!=='play'||!cur) return;
  var top=layers[layers.length-1];
  var delta=cur.x-top.x, ad=Math.abs(delta);
  var yTop=-cur.n*BH;

  if(ad>=cur.w){
    addDebris(cur.x,yTop,cur.w,BH,cur.hue,delta>=0?1:-1);
    cur=null; die(); return;
  }
  var nx, nw, perfect=false;
  if(ad<=TOL){
    perfect=true; nx=top.x; nw=top.w; combo++; perfects++;
    if(combo>maxCombo) maxCombo=combo;
    if(combo>=5&&nw<BASE_W){ var g=Math.min(4,BASE_W-nw); nx-=g/2; nw+=g; }
  } else {
    combo=0; nw=top.w-ad;
    if(delta>0){ nx=cur.x; addDebris(top.x+top.w,yTop,ad,BH,cur.hue,1); }
    else { nx=top.x; addDebris(cur.x,yTop,ad,BH,cur.hue,-1); }
  }
  layers.push({x:nx,w:nw,hue:cur.hue,flash:perfect?1:0.35});
  var pts=perfect?2+Math.min(combo-1,8):1;
  score+=pts; setScoreUI(score);
  if(perfect){
    rings.push({x:nx,y:yTop,w:nw,t:0});
    burst(nx,nw,yTop,cur.hue,14+Math.min(combo,10)*2,true);
    shake=Math.max(shake,2+Math.min(combo,8)*.5);
    texts.push({x:nx+nw/2,y:yTop-10,s:'퍼펙트 +'+pts,c:'#ffcf5c',t:0,big:true});
    sfxPerfect(combo); haptic(12);
  } else {
    burst(nx,nw,yTop,cur.hue,6,false);
    shake=Math.max(shake,3);
    texts.push({x:nx+nw/2,y:yTop-10,s:'+1',c:'#ffffff',t:0,big:false});
    sfxCut(); haptic(6);
  }
  updateCombo();
  spawn();
}
function die(){
  setState('dying'); overAt=t+0.85; shake=11; combo=0; updateCombo(); sfxOver(); haptic(40);
}
function start(){
  ensureAudio();
  var snap=(state==='over');
  $('menu').hidden=true; $('over').hidden=true;
  setState('play'); reset(snap);
}
function onTap(){
  if(paused) return;
  ensureAudio();
  if(state==='play') drop();
  else if(state==='menu') start();
  else if(state==='over'&&performance.now()>restartAt) start();
}
canvas.addEventListener('pointerdown',function(e){ e.preventDefault(); onTap(); });
window.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT') return;
  if(e.key==='Escape'&&!$('board').hidden){ closeBoard(); return; }
  if(e.code==='Space'||e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); onTap(); }
});

/* ---------- 이펙트 ---------- */
function burst(x0,w,y,hue,n,perf){
  for(var i=0;i<n;i++){
    var a=-Math.random()*Math.PI, sp=60+Math.random()*(perf?190:90);
    parts.push({
      x:x0+Math.random()*w, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0.5+Math.random()*0.5, max:1, size:2+Math.random()*3,
      c:perf?('hsl('+(hue+Math.random()*50-25)+' 95% 74%)'):'hsl(250 20% 80%)'
    });
    parts[parts.length-1].max=parts[parts.length-1].life;
  }
}
function addDebris(x,y,w,h,hue,dir){
  debris.push({x:x,y:y,w:w,h:h,vx:dir*(30+Math.random()*40),vy:-40,rot:0,vr:dir*(0.8+Math.random()*1.6),hue:hue});
}

/* ---------- 업데이트 ---------- */
function update(dt){
  t+=dt;
  if(cur&&(state==='play'||state==='menu')){
    var v=state==='menu'?110:Math.min(125+cur.n*4.2,300);
    cur.x+=cur.dir*v*dt;
    var minX=-cur.w*0.55, maxX=W-cur.w*0.45;
    if(cur.x>maxX){ cur.x=maxX; cur.dir=-1; } else if(cur.x<minX){ cur.x=minX; cur.dir=1; }
  }
  if(state==='dying'&&t>=overAt) showOver();

  camT=baseCam();
  cam+=(camT-cam)*(1-Math.exp(-dt*7));
  var topHue=layers[layers.length-1].hue;
  var diff=((topHue-bgHue+540)%360)-180;
  bgHue=(bgHue+diff*Math.min(1,dt*1.5)+360)%360;
  shake*=Math.exp(-dt*9); if(shake<0.05) shake=0;

  for(var i=Math.max(0,layers.length-4);i<layers.length;i++){ if(layers[i].flash>0) layers[i].flash=Math.max(0,layers[i].flash-dt*2.5); }
  for(i=parts.length-1;i>=0;i--){ var p=parts[i]; p.life-=dt; if(p.life<=0){ parts.splice(i,1); continue; } p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(i=debris.length-1;i>=0;i--){ var d=debris[i]; d.vy+=900*dt; d.x+=d.vx*dt; d.y+=d.vy*dt; d.rot+=d.vr*dt; if(d.y+cam>H+200) debris.splice(i,1); }
  for(i=rings.length-1;i>=0;i--){ rings[i].t+=dt/0.45; if(rings[i].t>=1) rings.splice(i,1); }
  for(i=texts.length-1;i>=0;i--){ texts[i].t+=dt/0.9; if(texts[i].t>=1) texts.splice(i,1); }
}

/* ---------- 그리기 ---------- */
function drawBlock(x,y,w,h,hue,flash){
  ctx.fillStyle='hsl('+hue+' 72% 56%)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='hsl('+hue+' 85% 74%)'; ctx.fillRect(x,y,w,4);
  ctx.fillStyle='hsl('+hue+' 70% 40%)'; ctx.fillRect(x,y+h-4,w,4);
  if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+(Math.min(1,flash)*0.75)+')'; ctx.fillRect(x,y,w,h); }
}
function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'hsl('+bgHue+' 48% 20%)');
  g.addColorStop(1,'hsl('+((bgHue+50)%360)+' 55% 8%)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,.35)';
  for(var s=0;s<stars.length;s++){
    var st=stars[s], sy=(((st.y*H+cam*st.p)%H)+H)%H;
    ctx.fillRect(st.x,sy,st.r,st.r);
  }

  var k=reduceMotion?0.3:1;
  ctx.save();
  ctx.translate((Math.random()-.5)*shake*2*k,(Math.random()-.5)*shake*2*k+cam);

  for(var i=layers.length-1;i>=0;i--){
    var L=layers[i], y=i===0?0:-i*BH;
    if(y+cam<-BH) continue;
    if(y+cam>H) break;
    drawBlock(L.x,y,L.w,i===0?Math.max(BH,H-cam+80):BH,L.hue,L.flash);
  }

  var top=layers[layers.length-1], topY=-(layers.length-1)*BH;
  if(state==='play'&&cur){
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1; ctx.setLineDash([4,5]);
    ctx.beginPath();
    ctx.moveTo(top.x,topY); ctx.lineTo(top.x,topY-BH*2);
    ctx.moveTo(top.x+top.w,topY); ctx.lineTo(top.x+top.w,topY-BH*2);
    ctx.stroke(); ctx.setLineDash([]);
  }
  if(cur) drawBlock(cur.x,-cur.n*BH,cur.w,BH,cur.hue,0);

  for(i=0;i<rings.length;i++){
    var r=rings[i], e=r.t*16;
    ctx.strokeStyle='rgba(255,236,170,'+(1-r.t)+')'; ctx.lineWidth=2.5;
    ctx.strokeRect(r.x-e,r.y-e,r.w+e*2,BH+e*2);
  }
  for(i=0;i<debris.length;i++){
    var d=debris[i];
    ctx.save(); ctx.translate(d.x+d.w/2,d.y+d.h/2); ctx.rotate(d.rot);
    drawBlock(-d.w/2,-d.h/2,d.w,d.h,d.hue,0); ctx.restore();
  }
  for(i=0;i<parts.length;i++){
    var p=parts[i]; ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  for(i=0;i<texts.length;i++){
    var tx=texts[i];
    ctx.globalAlpha=1-tx.t*tx.t;
    ctx.font=(tx.big?26:18)+'px "Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    var px=Math.max(70,Math.min(W-70,tx.x)), py=tx.y-tx.t*38;
    ctx.lineWidth=5; ctx.strokeStyle='rgba(16,14,38,.85)'; ctx.strokeText(tx.s,px,py);
    ctx.fillStyle=tx.c; ctx.fillText(tx.s,px,py);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

var last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000); last=now;
  if(canvas.width<=1) resize();
  if(!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------- 닉네임 ---------- */
var nick=store.get('ps_nick','')||('플레이어'+(100+Math.floor(Math.random()*900)));
store.set('ps_nick',nick);
$('nick').value=nick;
function getName(){ var v=$('nick').value.replace(/\s+/g,' ').trim().slice(0,10); return v||nick; }

/* ---------- 랭킹 (db) ---------- */
var db=null, uid=null, canWrite=null, scores=[], mine=null, writing=false;
var boardStatus='connecting';

function cloudReady(){ return !!(db&&uid); }
function cloudWritable(){ return cloudReady()&&canWrite!==false; }
function cloudBest(){ return mine?(Number(mine.best)||0):0; }
function myBest(){ return Math.max(localBest,cloudBest()); }

function rankInfo(sc){
  if(!cloudReady()) return null;
  var others=scores.filter(function(s){ return s.id!==uid; });
  var m=Math.max(sc,cloudBest());
  var rank=1+others.filter(function(s){ return s.best>m; }).length;
  var out=scores.length>=100&&scores[99].id!==uid&&m<scores[99].best;
  return {rank:rank,total:others.length+1,label:out?'100위 밖':rank+'위'};
}
function updateBest(){ $('best').textContent=String(myBest()); }
function updateMenuInfo(){
  var el=$('menu-info'); el.replaceChildren();
  var b=myBest();
  if(b>0){
    el.append('내 최고 기록 ');
    var s=document.createElement('b'); s.textContent=b+'점'; el.append(s);
    var info=rankInfo(b);
    if(info) el.append(' · '+info.label);
  } else {
    el.append('첫 기록을 남겨 보세요.');
  }
}
function setBoardStatus(s){
  boardStatus=s;
  var el=$('board-status');
  if(s==='connecting') el.textContent='랭킹을 불러오는 중이에요.';
  else if(s==='slow') el.textContent='응답이 느려요. 잠시 뒤에 다시 열어 보세요.';
  else if(s==='offline') el.textContent='랭킹에 연결할 수 없어요. 게임은 그대로 즐길 수 있어요.';
  else if(canWrite===false) el.textContent='보기 전용이에요. 기록을 올리려면 게시자에게 참여 권한을 요청하세요.';
  else el.textContent='점수가 높은 순서예요. 기록은 실시간으로 바뀌어요.';
}
function renderBoard(){
  var ol=$('rows'); ol.replaceChildren();
  if(!scores.length){
    var li=document.createElement('li'); li.className='empty';
    li.textContent=cloudReady()?'아직 기록이 없어요. 첫 번째 기록을 남겨 보세요.':'랭킹이 연결되면 여기에 순위가 나와요.';
    ol.append(li); return;
  }
  var prev=null, prevRank=0;
  scores.forEach(function(s,i){
    var rank=(prev!==null&&s.best===prev)?prevRank:i+1; prev=s.best; prevRank=rank;
    var li=document.createElement('li');
    li.className='r'+(s.id===uid?' me':'')+(rank<=3?' top'+rank:'');
    var no=document.createElement('span'); no.className='no'; no.textContent=String(rank);
    var nm=document.createElement('span'); nm.className='nm'; nm.textContent=s.name+(s.id===uid?' (나)':'');
    var sc=document.createElement('span'); sc.className='sc'; sc.textContent=String(s.best);
    li.append(no,nm,sc); ol.append(li);
  });
}
function onScores(snap){
  clearTimeout(slowTimer);
  scores=snap.docs.map(function(d){
    var v=d.data()||{};
    return {id:d.id,name:String(v.name||'익명').slice(0,10),best:Number(v.best)||0};
  });
  if(boardStatus!=='ok') setBoardStatus('ok');
  renderBoard(); updateMenuInfo();
  if(state==='over') renderRank(score,null);
}
var slowTimer=null;
function initCloud(){
  var c=window.claude;
  if(!c||!c.use){ setBoardStatus('offline'); renderBoard(); return; }
  Promise.all([c.use('db'),c.use('user')]).then(function(r){
    var dbns=r[0], user=r[1];
    if(!dbns||!user){ setBoardStatus('offline'); renderBoard(); return; }
    return Promise.all([user.id(),user.can('data.write')]).then(function(x){
      uid=x[0]; canWrite=x[1];
      if(!uid){ setBoardStatus('offline'); renderBoard(); return; }
      db=dbns;
      slowTimer=setTimeout(function(){ if(boardStatus==='connecting') setBoardStatus('slow'); },10000);
      db.collection('scores').orderBy('best','desc').limit(100).onSnapshot(onScores,function(){ setBoardStatus('offline'); });
      db.doc('scores/'+uid).onSnapshot(function(s){
        mine=s.exists?s.data():null; updateBest(); updateMenuInfo();
        if(state==='over') renderRank(score,null);
      },function(){});
    });
  }).catch(function(){ setBoardStatus('offline'); renderBoard(); });
}
function submitScore(sc){
  if(!cloudWritable()) return Promise.resolve('skip');
  if(sc<=cloudBest()) return Promise.resolve('nochange');
  if(writing) return Promise.resolve('busy');
  writing=true;
  return db.doc('scores/'+uid).set({name:getName(),best:sc,t:Date.now()}).then(function(){
    pendingScore=0; writing=false; return 'ok';
  },function(){
    pendingScore=Math.max(pendingScore,sc); writing=false; return 'fail';
  });
}
$('nick').addEventListener('change',function(){
  nick=getName(); $('nick').value=nick; store.set('ps_nick',nick);
  if(cloudWritable()&&mine&&mine.name!==nick&&!writing){
    writing=true;
    db.doc('scores/'+uid).update({name:nick}).then(function(){ writing=false; },function(){ writing=false; });
  }
});

/* ---------- 결과 시트 ---------- */
function renderRank(sc,status){
  if(state!=='over') return;
  var rl=$('rank-line'); rl.replaceChildren();
  var info=rankInfo(sc);
  if(info){
    var b=document.createElement('b'); b.textContent=info.label;
    rl.append('현재 ',b,' / '+info.total+'명');
  } else {
    rl.append('랭킹에 연결되지 않았어요');
  }
  var note='';
  if(!cloudReady()) note='기록은 이 기기에만 남아요.';
  else if(canWrite===false) note='보기 전용 링크라 랭킹에는 기록되지 않아요.';
  else if(status==='ok') note='새 기록을 랭킹에 올렸어요.';
  else if(status==='fail') note='랭킹 등록에 실패했어요. 다음 판이 끝나면 다시 시도해요.';
  else if(status==='pending') note='랭킹에 등록하는 중이에요.';
  $('over-note').textContent=note;
}
function showOver(){
  setState('over'); restartAt=performance.now()+650;
  var isBest=score>0&&score>myBest();
  localBest=Math.max(localBest,score); store.set('ps_best',String(localBest));
  $('final').textContent=String(score);
  $('badge').hidden=!isBest;
  $('st-blocks').textContent=String(layers.length-1);
  $('st-perf').textContent=String(perfects);
  $('st-combo').textContent=String(maxCombo);
  $('menu').hidden=true; $('over').hidden=false;
  updateBest();
  var toSend=Math.max(score,pendingScore);
  if(cloudWritable()&&toSend>cloudBest()){
    renderRank(score,'pending');
    submitScore(toSend).then(function(r){ renderRank(score,r); });
  } else {
    renderRank(score,'nochange');
  }
}

/* ---------- 버튼 ---------- */
function openBoard(){
  $('board').hidden=false; paused=true; renderBoard();
}
function closeBoard(){
  $('board').hidden=true; paused=false;
}
function syncSound(){ $('btn-sound').classList.toggle('muted',muted); }
$('start').addEventListener('click',function(){ nick=getName(); store.set('ps_nick',nick); start(); });
$('again').addEventListener('click',function(){ start(); });
$('to-board').addEventListener('click',openBoard);
$('btn-board').addEventListener('click',openBoard);
$('board-close').addEventListener('click',closeBoard);
$('to-menu').addEventListener('click',function(){
  $('over').hidden=true; $('menu').hidden=false;
  setState('menu'); reset(false); updateMenuInfo();
});
$('btn-sound').addEventListener('click',function(){
  muted=!muted; store.set('ps_mute',muted?'1':'0'); syncSound(); ensureAudio();
  if(!muted) tone(520,.08,'triangle',.14);
});

/* ---------- 시작 ---------- */
syncSound(); updateBest(); updateMenuInfo(); renderBoard();
reset(true);
requestAnimationFrame(function(now){ last=now; frame(now); });
initCloud();
})();
</script>
